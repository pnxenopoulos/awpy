[project]
name = "awpy"
description = "Awpy is a Counter-Strike 2 demo parser with a Rust backend."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Peter Xenopoulos", email = "pnxenopoulos@gmail.com" },
]
dynamic = ["version"]
keywords = ["counter-strike", "cs2", "demo", "parser", "esports"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["polars>=1.0", "typer>=0.12"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/pnxenopoulos/awpy"
Repository = "https://github.com/pnxenopoulos/awpy"
Issues = "https://github.com/pnxenopoulos/awpy/issues"

[project.scripts]
awpy = "awpy.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "maturin>=1.0,<2.0",
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.1a1",
]
docs = [
    "shibuya>=2024.0",
    "sphinx>=8.0",
    "myst-parser>=4.0",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "awpy._awpy"
python-source = "python"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
