[package]
name = "awpy"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Awpy is a Counter-Strike 2 demo parser"
license = "MIT"
repository = "https://github.com/pnxenopoulos/awpy"
documentation = "https://docs.rs/awpy"
authors = ["Peter Xenopoulos"]
keywords = ["counter-strike", "cs2", "demo", "parser", "source2"]
categories = ["game-development", "parser-implementations", "encoding", "parsing"]

[dependencies]
anyhow.workspace = true
memmap2 = "0.9"
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
snap = "1.1"
thiserror = "2.0"

awpy-proto = { workspace = true }
pbdems2 = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[lib]
name = "awpy"
path = "src/lib.rs"

[[bench]]
name = "parse"
harness = false

[lints]
workspace = true
