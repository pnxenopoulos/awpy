[package]
name = "awpy"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Awpy is a Counter-Strike 2 demo parser"
license = "MIT"
repository = "https://github.com/pnxenopoulos/awpy"
documentation = "https://docs.rs/awpy"
authors = ["Peter Xenopoulos"]
keywords = ["counter-strike", "cs2", "demo", "parser", "source2"]
categories = ["game-development", "parser-implementations", "encoding", "parsing"]

[dependencies]
anyhow = "1.0"
memmap2 = "0.9"
prost = "0.14"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snap = "1.1"
thiserror = "2.0"

awpy-proto = { workspace = true }

[dev-dependencies]
criterion = "0.5"

[lib]
name = "awpy"
path = "src/lib.rs"

[[bench]]
name = "parse"
harness = false
