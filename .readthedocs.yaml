version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - pip install uv
      - uv sync --group docs --no-install-project --project crates/awpy-python
    build:
      html:
        - uv run --project crates/awpy-python sphinx-build -b html crates/awpy-python/docs $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: crates/awpy-python/docs/conf.py
