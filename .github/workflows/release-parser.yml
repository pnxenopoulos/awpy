name: Release Parser

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to release"
        required: true
        type: choice
        options:
          - awpy-proto
          - awpy
      version:
        description: "Expected package version (without a leading v)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci-gate:
    name: Verify release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_title: ${{ steps.release.outputs.release_title }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Check CI, version, and tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.crate }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: bash scripts/release.sh check

  publish:
    name: Publish ${{ inputs.crate }} to crates.io
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PACKAGE: ${{ inputs.crate }}
          VERSION: ${{ needs.ci-gate.outputs.version }}
        run: |
          encoded_version=$(printf '%s' "$VERSION" | jq -sRr @uri)
          status=$(curl -sSL --retry 3 -A awpy-release-ci -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/$PACKAGE/$encoded_version")
          case "$status" in
            200) echo "$PACKAGE $VERSION is already published; skipping." ;;
            404) cargo publish --locked -p "$PACKAGE" --registry crates-io ;;
            *) echo "Could not check $PACKAGE publication (HTTP $status)." >&2; exit 1 ;;
          esac

  finalize:
    name: Tag and publish the GitHub release
    needs: [ci-gate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.ci-gate.outputs.tag }}
          RELEASE_TITLE: ${{ needs.ci-gate.outputs.release_title }}
        run: bash scripts/release.sh finalize
