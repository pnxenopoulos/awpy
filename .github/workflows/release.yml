name: Release Awpy

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component to release"
        required: true
        type: choice
        options:
          - awpy-proto
          - awpy
          - awpy-python
      version:
        description: "Expected package version (without a leading v)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci-gate:
    name: Verify release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_title: ${{ steps.release.outputs.release_title }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Check CI, version, and tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.component }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: bash scripts/release.sh check

  build-linux:
    name: Build wheels (Linux)
    needs: ci-gate
    if: inputs.component == 'awpy-python'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m crates/awpy-python/Cargo.toml --interpreter 3.11 3.12 3.13 3.14
          manylinux: auto

      # Build on Python 3.14, as in CI, for compatibility with Python 3.15.
      - name: Build compatible wheel for Python 3.15
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m crates/awpy-python/Cargo.toml --interpreter 3.14 --features pyo3/abi3-py314
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  build-macos:
    name: Build wheels (macOS)
    needs: ci-gate
    if: inputs.component == 'awpy-python'
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m crates/awpy-python/Cargo.toml --interpreter 3.11 3.12 3.13 3.14

      # Build on Python 3.14, as in CI, for compatibility with Python 3.15.
      - name: Build compatible wheel for Python 3.15
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m crates/awpy-python/Cargo.toml --interpreter 3.14 --features pyo3/abi3-py314

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  build-windows:
    name: Build wheels (Windows)
    needs: ci-gate
    if: inputs.component == 'awpy-python'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist -m crates/awpy-python/Cargo.toml --interpreter 3.11 3.12 3.13 3.14

      # Build on Python 3.14, as in CI, for compatibility with Python 3.15.
      - name: Build compatible wheel for Python 3.15
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist -m crates/awpy-python/Cargo.toml --interpreter 3.14 --features pyo3/abi3-py314

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x86_64
          path: dist

  build-sdist:
    name: Build sdist
    needs: ci-gate
    if: inputs.component == 'awpy-python'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/awpy-python/Cargo.toml

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish-rust:
    name: Publish ${{ inputs.component }} to crates.io
    needs: ci-gate
    if: inputs.component == 'awpy-proto' || inputs.component == 'awpy'
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PACKAGE: ${{ inputs.component }}
          VERSION: ${{ needs.ci-gate.outputs.version }}
        run: |
          encoded_version=$(printf '%s' "$VERSION" | jq -sRr @uri)
          status=$(curl -sSL --retry 3 -A awpy-release-ci -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/$PACKAGE/$encoded_version")
          case "$status" in
            200) echo "$PACKAGE $VERSION is already published; skipping." ;;
            404) cargo publish --locked -p "$PACKAGE" --registry crates-io ;;
            *) echo "Could not check $PACKAGE publication (HTTP $status)." >&2; exit 1 ;;
          esac

  publish-python:
    name: Publish awpy-python to PyPI
    needs: [ci-gate, build-linux, build-macos, build-windows, build-sdist]
    if: inputs.component == 'awpy-python'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  finalize:
    name: Tag and publish the GitHub release
    needs: [ci-gate, publish-rust, publish-python]
    if: >-
      ${{
        always() &&
        needs.ci-gate.result == 'success' &&
        (
          (inputs.component == 'awpy-python' && needs.publish-python.result == 'success') ||
          (inputs.component != 'awpy-python' && needs.publish-rust.result == 'success')
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.ci-gate.outputs.tag }}
          RELEASE_TITLE: ${{ needs.ci-gate.outputs.release_title }}
        run: bash scripts/release.sh finalize
