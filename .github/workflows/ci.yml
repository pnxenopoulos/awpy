name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format & Lint (Rust)
    runs-on: ubuntu-latest  
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (stable) + rustfmt, clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint-${{ runner.os }}-stable

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features --exclude awpy-dev --exclude awpy-python

  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  test-rust:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Test
        run: cargo nextest run --workspace --all-features --exclude awpy-python --failure-output immediate-final

  lint-python:
    name: Format & Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          python-version: "3.13"

      - name: ruff
        working-directory: crates/awpy-python
        run: |
          uv sync --no-install-project
          uv run ruff check python tests
          uv run ruff format --check python tests

      - name: ty
        working-directory: crates/awpy-python
        run: uv run ty check python

  build-python-wheels:
    name: Build Python Wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --out dist -m crates/awpy-python/Cargo.toml --interpreter 3.11 3.12 3.13
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheels
          path: dist/*.whl

  test-python:
    name: Python Tests (${{ matrix.python-version }})
    needs: build-python-wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          name: python-wheels
          path: dist

      - name: Install wheel and test dependencies
        working-directory: crates/awpy-python
        run: |
          uv sync --no-install-project
          CPVER="cp$(echo ${{ matrix.python-version }} | tr -d .)"
          WHEEL=$(ls ../../dist/awpy-*-${CPVER}-*.whl)
          uv pip install "$WHEEL"

      - name: Run pytest
        working-directory: crates/awpy-python
        # Excludes the `fixtures` marker (the ground-truth bench over large
        # demos); that runs in the manual `fixtures-bench` job. Demo-backed
        # schema tests skip here unless AWPY_RUN_FIXTURES is set to fetch one.
        run: uv run pytest tests/ -m "not fixtures" -v

  # Ground-truth bench: download the real match fixtures (from awpy-fixtures
  # releases, via tests/fixtures/manifest.json) and assert Awpy's output against
  # each match's known scoreboard. Manual-only + cached, since the demos are
  # ~1.5 GB; trigger it from the Actions tab (Run workflow).
  fixtures-bench:
    name: Ground-truth bench
    needs: build-python-wheels
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          python-version: "3.11"

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          name: python-wheels
          path: dist

      - name: Cache demo fixtures
        uses: actions/cache@v6
        with:
          path: ~/.cache/awpy-fixtures
          key: awpy-fixtures-${{ hashFiles('crates/awpy-python/tests/fixtures/manifest.json') }}

      - name: Install wheel and test dependencies
        working-directory: crates/awpy-python
        run: |
          uv sync --no-install-project
          WHEEL=$(ls ../../dist/awpy-*-cp311-*.whl)
          uv pip install "$WHEEL"

      - name: Run ground-truth bench
        working-directory: crates/awpy-python
        env:
          AWPY_RUN_FIXTURES: "1"
        run: uv run pytest -m fixtures tests/test_ground_truth.py -v

  docs:
    name: Sphinx Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          python-version: "3.12"

      - name: Build docs
        working-directory: crates/awpy-python
        run: |
          uv sync --group docs --no-install-project
          uv run sphinx-build -W -b html docs docs/_build/html

  check:
    name: CI Check
    if: always()
    needs: [lint, deny, test-rust, lint-python, build-python-wheels, test-python, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ||
                "${{ needs.deny.result }}" != "success" ||
                "${{ needs.test-rust.result }}" != "success" ||
                "${{ needs.lint-python.result }}" != "success" ||
                "${{ needs.build-python-wheels.result }}" != "success" ||
                "${{ needs.test-python.result }}" != "success" ||
                "${{ needs.docs.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
