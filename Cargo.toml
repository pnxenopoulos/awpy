[workspace]
exclude = [
  "scripts/build-protos",
]
members = [
  "crates/awpy",
  "crates/awpy-dev",
  "crates/awpy-proto",
  "crates/awpy-python",
]
resolver = "2"

[workspace.package]
version = "3.0.0"
rust-version = "1.88.0"

[workspace.dependencies]
awpy = { path = "crates/awpy", version = "3.0.0" }
awpy-proto = { path = "crates/awpy-proto", version = "0.1" }
pbdems2 = "0.3"
anyhow = "1.0"
prost = "0.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.dev]
incremental = false   # awpy-proto is a large generated crate; incremental bookkeeping
                      # (dep-graph + query-cache) balloons target/ for little gain.

[profile.dev.package.awpy-proto]
debug = false         # never step into prost-generated proto code; skip its debuginfo

[profile.release]
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization, slower compile
